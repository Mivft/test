<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilim Tarihi Sınav Simülasyonu</title>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--text-color: #f8fafc;
--accent-color: #38bdf8;
--success-color: #22c55e;
--error-color: #ef4444;
--border-color: #334155;
}

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}

.container {
width: 100%;
max-width: 700px;
background: var(--card-bg);
border-radius: 16px;
padding: 30px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
border: 1px solid var(--border-color);
}

h1 {
text-align: center;
color: var(--accent-color);
margin-bottom: 25px;
font-size: 1.5rem;
}

.quiz-info {
display: flex;
justify-content: space-between;
margin-bottom: 20px;
font-size: 0.9rem;
color: #94a3b8;
border-bottom: 1px solid var(--border-color);
padding-bottom: 10px;
}

.question-text {
font-size: 1.15rem;
font-weight: 600;
margin-bottom: 20px;
line-height: 1.5;
}

.options-list {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 20px;
}

.option-btn {
background-color: #0f172a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 14px 18px;
border-radius: 8px;
text-align: left;
cursor: pointer;
font-size: 1rem;
transition: all 0.2s ease;
}

.option-btn:hover:not(:disabled) {
background-color: #334155;
border-color: var(--accent-color);
}

.option-btn.correct {
background-color: rgba(34, 197, 94, 0.2);
border-color: var(--success-color);
color: #4ade80;
}

.option-btn.wrong {
background-color: rgba(239, 68, 68, 0.2);
border-color: var(--error-color);
color: #f87171;
}

.explanation-box {
background-color: #0f172a;
border-left: 4px solid var(--accent-color);
padding: 15px;
border-radius: 0 8px 8px 0;
margin-bottom: 20px;
font-size: 0.95rem;
line-height: 1.4;
display: none;
}

.next-btn {
background-color: var(--accent-color);
color: #0f172a;
border: none;
width: 100%;
padding: 14px;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
display: none;
transition: opacity 0.2s;
}

.next-btn:hover {
opacity: 0.9;
}

.result-screen {
text-align: center;
display: none;
}

.result-screen h2 {
font-size: 2rem;
margin-bottom: 10px;
}

.restart-btn {
background-color: var(--success-color);
color: white;
border: none;
padding: 14px 28px;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
<h1>Bilim Tarihi Sınav Simülasyonu</h1>

<div id="quiz-container">
<div class="quiz-info">
<span id="question-counter">Soru: 1/38</span>
<span id="score-display">Puan: 0</span>
</div>

<div class="question-text" id="question-text">Soru yükleniyor...</div>

<div class="options-list" id="options-list">
<!-- Şıklar buraya gelecek -->
</div>

<div class="explanation-box" id="explanation-box">
<!-- Açıklama buraya gelecek -->
</div>

<button class="next-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soru</button>
</div>

<div class="result-screen" id="result-screen">
<h2>Test Bitti Lan!</h2>
<p id="final-score" style="font-size: 1.2rem; margin: 20px 0;"></p>
<button class="restart-btn" onclick="restartQuiz()">Baştan Başla</button>
</div>
</div>
